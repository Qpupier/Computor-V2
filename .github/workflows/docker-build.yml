name: Build Docker Image

on:
  push:
  paths:
    - 'Dockerfile'
  workflow_dispatch: # Permet de le lancer manuellement la première fois

jobs:
  build-image:
  runs-on: ubuntu-latest
  permissions:
    contents: read
    packages: write
  steps:
    - uses: actions/checkout@5

    - name: Log in to GHCR
    uses: docker/login-action@v3
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
    uses: docker/build-push-action@v6
    with:
      context: .
      push: true
      tags: ghcr.io/${{ github.repository }}/env:latest
