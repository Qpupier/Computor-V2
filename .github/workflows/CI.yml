name: CI
on:
  push:
    branches: ["master"]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: [format, logic_error, numbers, complexes, matrices, polynomials, subject, bonus]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y valgrind libreadline-dev
      - name: Compilation
        run: make -j
      - name: Unit tests - ${{ matrix.test }}
        run: ./unit_tests/${{ matrix.test }}.sh debug
