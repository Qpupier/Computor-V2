name: CI
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilation
        run: make -j
      - name: Unit tests - Format
        run: ./unit_tests/format.sh
      - name: Unit tests - Logic errors
        run: ./unit_tests/logic_error.sh
      - name: Unit tests - Numbers
        run: ./unit_tests/numbers.sh
